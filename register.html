<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!--This header contains a level 1 header logo and navigation links.-->
    <header>
        <h1>Cuddles Petting Zoo</h1>

        <!--The navigation area is implemented using a table with one row.-->
    
        <nav>
        
            <ul>
                <li><a href="index.html">Home</a></li>
                
                <li><a href="about.html">About</a></li>
                
                <li><a href="register.html">Register</a></li>
            </ul> 
        
        </nav>
        <hr>
    </header>
    <main>
        <article>
            <h2>Please register.</h2>
            <p>You are invited to register so that you can get to know our 
                pet community.
            </p>
            <!--This section is the form that allows text entry and button selection-->
            <section>
                <h4>Fill out the form below</h4>
                <form>
                    <!--A label precedes each text entry box-->
                    <div class="textboxgroup">
                    <label for="firstname">First Name:</label>
                    <input id="firstname" type="text"><br><br>
                    <label for="lastname">Last Name:</label>
                    <input id="lastname" type="text"><br><br>
                    <label for="email">E-Mail:</label>
                    <input id="email" type="text"><br><br>
                    <label for="guests">Number of Guests:</label>
                    <input id="guests" type="text"><br><br><br>
                    </div>
                    <!--A grouped radio button limits selection to one option-->
                    <h4>What treat would you like?</h4>
                    <div class = "radiogroup">
                    <input type="radio" name="treat" id="cheesecake" value="Cheesecake"/>
                    <label for="cheesecake">Cheesecake</label>
                    <input type="radio" name="treat" id="cherrypie" value="Cherry Pie"/>
                    <label for="cherrypie">Cherry Pie</label>
                    <input type="radio" name="treat" id="icecream" value="Ice Cream"/>
                    <label for="icecream">Ice Cream</label>
                    </div>
                    <!--A submit button for submitting the form-->
                    <br><br>
                    <input type="submit">
                </form>
            </section>
        </article>
    </main>
     <!--The footer shows some information on the author and date-->
     <hr>
     <footer><p> Feb 6, 2025 by Nubila Levon</p></footer>
</body>
</html>
